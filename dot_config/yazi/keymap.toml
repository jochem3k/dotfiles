# Unified navigation (Enter folder or run file using 'l')
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter a directory or open a file"

# Sync file yanking natively to system clipboard (Wayland/wl-copy)
[[mgr.prepend_keymap]]
on   = "y"
run  = [ 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list', "yank" ]
desc = "Yank files to system clipboard"