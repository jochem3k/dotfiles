# Register the Git status engine fetcher hooks
[[plugin.prepend_fetchers]]
group = "git"
url   = "*"
run   = "git"

[[plugin.prepend_fetchers]]
group = "git"
url   = "*/"
run   = "git"

# Register Glow as your primary styled Markdown previewer
[[plugin.prepend_previewers]]
mime = "text/markdown"
run  = "glow"