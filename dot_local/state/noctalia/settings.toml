config_version = 12

[bar]
order = [ "Panel" ]

    [bar.Panel]
    center = [ "clock", "notifications" ]
    concave_edge_corners = false
    end = [
        "audio_visualizer",
        "media",
        "spacer_20",
        "tray",
        "spacer_20",
        "bar",
        "spacer_20",
        "clipboard",
        "volume",
        "brightness",
        "network",
        "bluetooth",
        "battery",
        "control-center"
    ]
    font_family = "Adwaita Sans"
    margin_ends = 0
    radius = 0
    start = [ "launcher", "spacer_15", "workspaces", "spacer_20", "active_window" ]

        [bar.Panel.dead_zone.actions]
        middle = "volume-mute"
        scroll_down = "volume-down"
        scroll_up = "volume-up"

[battery]
warning_threshold = 20

[control_center]
hidden_tabs = [ "screen-time" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
concave_edge_corners = false
cross_axis_padding = 4
enabled = true
main_axis_padding = 8
margin_edge = 4
pinned = [
    "org.gnome.Nautilus",
    "com.mitchellh.ghostty",
    "app.zen_browser.zen",
    "dev.zed.Zed",
    "md.obsidian.Obsidian",
    "com.valvesoftware.Steam",
    "dev.vencord.Vesktop",
    "com.spotify.Client"
]
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners.bottom_left]
action = "window_switcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[location]
address = "utrecht, netherlands"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."blackbartblues/keymap"]
compositor = "niri"
niri_config = "/var/home/jochem/.config/niri/config.kdl"

[plugins]
enabled = [ "icefish/phone-connect" ]

[shell]
font_family = "Adwaita Sans"
polkit_agent = true
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    compact = true

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_launcher = true
    session_position = "center"

    [shell.screen_corners]
    size = 1

[theme]
community_palette = "ADW"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/usr/share/backgrounds/custom"

    [wallpaper.default]
    path = "/usr/share/backgrounds/custom/bazzite.png"

    [wallpaper.last]
    path = "/usr/share/backgrounds/custom/bazzite.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/backgrounds/custom/bazzite.png"

[widget.audio_visualizer]
color_1 = "secondary"
color_2 = "on_tertiary"

    [widget.audio_visualizer.actions]
    back = "media next"
    forward = "media previous"
    left = "panel-toggle control-center media"
    right = "media pause"
    scroll_down = "media next"
    scroll_up = "media previous"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.brightness]
show_label = false

[widget.clock]
timezone = "Europe/Amsterdam"

[widget.launcher]
glyph = "grid-dots"

[widget.media]
art_size = 29
hide_when_no_media = true
max_length = 298
title_scroll = "on_hover"

    [widget.media.actions]
    back = "media next"
    forward = "media previous"
    scroll_down = "media next"
    scroll_up = "media previous"

[widget.network]
show_label = false
vpn_status = "both"

[widget.notifications]
hide_when_no_unread = true

[widget.spacer_15]
length = 15
type = "spacer"

[widget.spacer_20]
type = "spacer"

[widget.volume]
show_label = false

[widget.workspaces]
empty_color = "on_tertiary"
hide_when_empty = true
occupied_color = "primary"