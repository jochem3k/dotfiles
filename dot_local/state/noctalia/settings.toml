config_version = 10

[audio]
enable_sounds = true

[bar.default]
center = [ "media", "clock", "notifications", "bar" ]
concave_edge_corners = false
end = [ "tray", "clipboard", "volume", "brightness", "network", "bluetooth", "battery", "control-center" ]
margin_edge = 3
margin_ends = 3
radius = 16
start = [ "launcher", "workspaces", "spacer_2", "active_window" ]

[dock]
enabled = true
reserve_space = false
smart_auto_hide = true

[hot_corners.top_right]
action = "launcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = []

[shell]
font_family = "Adwaita Sans"
polkit_agent = true
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    session_position = "center"

[theme]
community_palette = "ADW"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/usr/share/backgrounds/custom"

    [wallpaper.default]
    path = "/usr/share/backgrounds/custom/bazzite.png"

    [wallpaper.last]
    path = "/usr/share/backgrounds/custom/bazzite.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/backgrounds/custom/bazzite.png"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.brightness]
show_label = false

[widget.launcher]
enabled = false

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false
vpn_status = "both"

[widget.notifications]
hide_when_no_unread = true

[widget.spacer_2]
type = "spacer"

[widget.volume]
show_label = false