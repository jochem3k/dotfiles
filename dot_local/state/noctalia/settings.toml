config_version = 10

[bar.default]
margin_ends = 0

[dock]
enabled = true
reserve_space = false
smart_auto_hide = true

[hot_corners.top_right]
action = "launcher"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
polkit_agent = true
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

[theme]
builtin = "Dracula"
community_palette = "ADW"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/usr/share/backgrounds/custom"

    [wallpaper.default]
    path = "/usr/share/backgrounds/custom/bazzite.png"

    [wallpaper.last]
    path = "/usr/share/backgrounds/custom/bazzite.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/backgrounds/custom/bazzite.png"